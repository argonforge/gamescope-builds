name: Build Gamescope for Devuan stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.16.22)'
        required: true
        default: 'v3.16.22'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
            isa: avx2
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
            isa: avx512
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: nafigat0r/devuan:6-dev
    env:
      CCACHE_DIR: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}/.ccache-${{ matrix.ver }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Compute version variables
        run: |
          GAMESCOPE_TAG="${TAG#v}"
          echo "GAMESCOPE_TAG=$GAMESCOPE_TAG" >> $GITHUB_ENV
          echo "Using GAMESCOPE_TAG=$GAMESCOPE_TAG"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gamescope-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-gamescope-${{ matrix.ver }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Download Debian packaging
        run: |
          mkdir -p /tmp/gamescope-debian
          cd /tmp/gamescope-debian
          wget -q --show-progress \
            "http://ftp.debian.org/debian/pool/contrib/g/gamescope/gamescope_${GAMESCOPE_TAG}+ds-1~bpo13+1.debian.tar.xz" \
            -O gamescope-debian.tar.xz || \
          { echo "Could not download Debian packaging for ${GAMESCOPE_TAG}"; exit 1; }
          tar xf gamescope-debian.tar.xz
          echo "Debian packaging extracted:"
          ls -la debian/

      - name: Clone Gamescope source
        run: |
          rm -rf gamescope
          git clone --depth 1 --branch "${GAMESCOPE_TAG}" \
            https://github.com/ValveSoftware/gamescope.git gamescope
          cd gamescope
          git submodule update --init --recursive
          echo "Gamescope source at tag: ${GAMESCOPE_TAG}"

      - name: Copy Debian packaging
        run: |
          cp -r /tmp/gamescope-debian/debian gamescope/
          ls -la gamescope/debian/

      - name: Apply Debian patches
        working-directory: gamescope
        run: |
          if [ ! -d debian/patches ]; then
            echo "ERROR: debian/patches not found - cannot proceed"
            exit 1
          fi

          export QUILT_PATCHES=debian/patches
          quilt push -a

          echo "--- Applied patches ---"
          quilt applied

          # Verify that the glm/stb patch was applied
          if grep -q "subproject('glm')" meson.build; then
            echo "WARNING: glm is still a subproject - patch may not have applied"
          else
            echo "OK: glm converted to dependency"
          fi

      - name: Copy debian/rules from repo
        working-directory: gamescope
        run: |
          # Use our own debian/rules to build with Clang + LLD,
          # disable OpenVR support, and skip dh_dwz (Clang DWARF-5).
          # CFLAGS/CXXFLAGS are passed via env in the build step.

          cp ../.github/helpers/rules debian/rules
          chmod +x debian/rules

          echo "--- debian/rules ---"
          cat debian/rules

      - name: Bump package version with ISA suffix
        working-directory: gamescope
        env:
          DEBEMAIL: postmaster@itvault.info
          DEBFULLNAME: Argon Forge Gamescope workflow
        run: |
          CURRENT_VER=$(dpkg-parsechangelog -S Version)
          NEW_VER="${CURRENT_VER}+${{ matrix.isa }}"
          echo "Original version: ${CURRENT_VER}"
          echo "New version: ${NEW_VER}"
          dch --newversion "$NEW_VER" "Rebuild with ${{ matrix.isa }} optimizations"

      - name: Build .deb package
        working-directory: gamescope
        env:
          CC: ccache clang
          CXX: ccache clang++
          DEB_CFLAGS_MAINT_APPEND: ${{ matrix.flags }}
          DEB_CXXFLAGS_MAINT_APPEND: ${{ matrix.flags }}
        run: |
          echo "=== Effective CFLAGS ==="
          dpkg-buildflags --get CFLAGS
          echo "=== Effective CXXFLAGS ==="
          dpkg-buildflags --get CXXFLAGS
          echo "==="

          # Clean any previous build
          dh_clean || true
          rm -rf obj-* || true

          # Verify ccache sees the compilers
          ccache --version | head -1
          ccache -s

          # Build only binary package, no source, no signing
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs parallel=$(nproc)"
          dpkg-buildpackage -b -us -uc

          echo "--- .deb files in parent directory ---"
          ls -lh ../*.deb || echo "No .deb files found"

      - name: Collect packages
        run: |
          mkdir -p packages
          find . -maxdepth 1 -name '*.deb' ! -name '*dbgsym*' ! -name '*ddeb*' -exec mv {} packages/ \;
          echo "--- packages/ contents ---"
          ls -lh packages/
          if [ -z "$(ls -A packages/)" ]; then
            echo "ERROR: packages/ is empty - dpkg-buildpackage produced no .deb"
            exit 1
          fi

      - name: Make archive
        run: |
          tar -caf "gamescope-${GAMESCOPE_TAG}-x86-64-${{ matrix.ver }}.tar.zst" "packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamescope-deb-packages-${{ matrix.ver }}
          path: ./*.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: ccache -s

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reprepro and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Unpack deb files
        run: |
          mkdir -p build
          for f in artifacts/*.tar.zst; do
            echo "Extracting $f"
            tar --zstd -xf "$f" -C build --strip-components=1
          done
          ls -lh build/

      - name: Import GPG key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --no-tty --import
          echo "--- Imported secret keys ---"
          gpg --list-secret-keys
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create APT repository
        run: |
          mkdir -p apt-repo/conf
          cp .github/helpers/distributions apt-repo/conf/distributions

          reprepro -Vb apt-repo -C main -A amd64 includedeb stable-avx2 build/gamescope_*+avx2_amd64.deb
          reprepro -Vb apt-repo -C main -A amd64 includedeb stable-avx512 build/gamescope_*+avx512_amd64.deb

          echo "--- Repository structure ---"
          find apt-repo -type f | sort

          echo "--- Export public key ---"
          gpg --armor --export > apt-repo/public.asc
          ls -lh apt-repo/public.asc

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GAMESCOPE_TAG="${TAG#v}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="Gamescope ${GAMESCOPE_TAG} (Clang)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.zst
          fi