name: Build Gamescope for Devuan stable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.16.22)'
        required: true
        default: 'v3.16.22'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRAFT: ${{ inputs.draft || 'false' }}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Single runner, so run after build i386. Do not parallelize
    needs: build-i386
    strategy:
      fail-fast: true
      matrix:
        include:
          - ver: v3
            flags: -march=x86-64-v3 -mtune=znver3 ${{ vars.FLAGS }}
            isa: avx2
          - ver: v4
            flags: -march=x86-64-v4 -mtune=znver4 ${{ vars.FLAGS }}
            isa: avx512
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      IMAGE: nafigat0r/devuan:6-dev
      WORKDIR: /work
      HOST_CCACHE_DIR: "${{ github.workspace }}/.ccache-gamescope-${{ matrix.ver }}"
      CCACHE_DIR: "/work/.ccache-gamescope-${{ matrix.ver }}"
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: '6'
    steps:
      - name: Compute version variables
        run: |
          GAMESCOPE_TAG="${TAG#v}"
          echo "GAMESCOPE_TAG=$GAMESCOPE_TAG" >> $GITHUB_ENV
          echo "Using GAMESCOPE_TAG=$GAMESCOPE_TAG"

      - name: Fix workspace ownership
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            --user 0:0 \
            "$IMAGE" chown -R $(id -u):$(id -g) "${{ env.WORKDIR }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          set-safe-directory: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HOST_CCACHE_DIR }}
          key: ccache-gamescope-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-gamescope-${{ matrix.ver }}-

      - name: Download Debian packaging and clone source
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -e GAMESCOPE_TAG="${{ env.GAMESCOPE_TAG }}" \
            -w "${{ env.WORKDIR }}" \
            "$IMAGE" bash -c '
              set -e

              mkdir -p /tmp/gamescope-debian
              cd /tmp/gamescope-debian

              wget -q --show-progress \
                "http://ftp.debian.org/debian/pool/contrib/g/gamescope/gamescope_${GAMESCOPE_TAG}+ds-1~bpo13+1.debian.tar.xz" \
                -O gamescope-debian.tar.xz || { \
                  echo "Could not download Debian packaging for ${GAMESCOPE_TAG}"; \
                  exit 1; \
                }

              tar xf gamescope-debian.tar.xz
              echo "Debian packaging extracted:"
              ls -la debian/

              cd /work
              rm -rf gamescope
              git clone --depth 1 --branch "${GAMESCOPE_TAG}" \
                https://github.com/ValveSoftware/gamescope.git gamescope
              cd gamescope
              git submodule update --init --recursive
              echo "Gamescope source at tag: ${GAMESCOPE_TAG}"

              cp -r /tmp/gamescope-debian/debian debian
              ls -la debian/
            '

      - name: Apply Debian patches
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -w "${{ env.WORKDIR }}/gamescope" \
            "$IMAGE" bash -c '
              if [ ! -d debian/patches ]; then
                echo "ERROR: debian/patches not found - cannot proceed"
                exit 1
              fi

              export QUILT_PATCHES=debian/patches
              quilt push -a

              echo "--- Applied patches ---"
              quilt applied

              if grep -qE "subproject\(.glm.\)" meson.build; then
                echo "WARNING: glm is still a subproject - patch may not have applied"
              else
                echo "OK: glm converted to dependency"
              fi
            '

      - name: Copy debian/rules from repo
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -w "${{ env.WORKDIR }}/gamescope" \
            "$IMAGE" bash -c '
              # Use our own debian/rules to build with Clang + LLD,
              # disable OpenVR support, and skip dh_dwz (Clang DWARF-5).
              # CFLAGS/CXXFLAGS are passed via DEB_CFLAGS_MAINT_APPEND / DEB_CXXFLAGS_MAINT_APPEND env vars.

              cp ../.github/helpers/rules debian/rules
              chmod +x debian/rules

              echo "--- debian/rules ---"
              cat debian/rules
            '

      - name: Bump package version with ISA suffix
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -e DEBEMAIL=postmaster@itvault.info \
            -e DEBFULLNAME="Argon Forge Gamescope workflow" \
            -w "${{ env.WORKDIR }}/gamescope" \
            "$IMAGE" bash -c '
              if [ ! -f debian/changelog ]; then
                echo "ERROR: debian/changelog not found"
                exit 1
              fi

              CURRENT_VER=$(dpkg-parsechangelog -S Version)
              if [ -z "$CURRENT_VER" ]; then
                echo "ERROR: could not parse current version from debian/changelog"
                exit 1
              fi

              export SOURCE_DATE_EPOCH=$(dpkg-parsechangelog -S Timestamp)

              NEW_VER="${CURRENT_VER}+${{ matrix.isa }}"
              echo "Original version: ${CURRENT_VER}"
              echo "New version: ${NEW_VER}"
              dch --newversion "$NEW_VER" "Rebuild with ${{ matrix.isa }} optimizations"
            '

      - name: Build .deb package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e CCACHE_DIR="${{ env.CCACHE_DIR }}" \
            -e CCACHE_MAXSIZE \
            -e CCACHE_COMPRESS \
            -e CCACHE_COMPRESSLEVEL \
            -e HOME=/tmp \
            -e CC="ccache clang" \
            -e CXX="ccache clang++" \
            -e DEB_CFLAGS_MAINT_APPEND="${{ matrix.flags }}" \
            -e DEB_CXXFLAGS_MAINT_APPEND="${{ matrix.flags }}" \
            -e DEB_BUILD_OPTIONS="noautodbgsym noddebs parallel=$(nproc)" \
            -w "${{ env.WORKDIR }}/gamescope" \
            "$IMAGE" bash -c '
              # clang-19 installs /usr/lib/llvm-19/bin/clang; make it discoverable
              export PATH="/usr/lib/llvm-19/bin:$PATH"

              echo "=== Effective CFLAGS ==="
              dpkg-buildflags --get CFLAGS
              echo "=== Effective CXXFLAGS ==="
              dpkg-buildflags --get CXXFLAGS
              echo "==="

              # Clean any previous build
              dh_clean || true
              rm -rf obj-* || true

              # Verify ccache sees the compilers
              ccache --version | head -1
              ccache -s

              # Build only binary package, no source, no signing
              dpkg-buildpackage -b -us -uc

              echo "--- .deb files in parent directory ---"
              ls -lh ../*.deb || echo "No .deb files found"
            '

      - name: Collect packages
        run: |
          mkdir -p packages
          find . -maxdepth 1 -name '*.deb' ! -name '*dbgsym*' ! -name '*ddeb*' -exec mv {} packages/ \;

          if [ -z "$(ls -A packages/)" ]; then
            echo "ERROR: packages/ is empty - dpkg-buildpackage produced no .deb"
            exit 1
          fi

          echo "--- packages/ contents ---"
          ls -lh packages/

      - name: Make archive
        run: |
          tar -caf "gamescope-${GAMESCOPE_TAG}-x86-64-${{ matrix.ver }}.tar.zst" "packages"

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamescope-deb-packages-${{ matrix.ver }}
          path: ./*.zst
          retention-days: ${{ env.DRAFT == 'true' && 1 || 5 }}

      - name: Show ccache stats
        if: always()
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e CCACHE_DIR="${{ env.CCACHE_DIR }}" \
            -e CCACHE_MAXSIZE \
            -e CCACHE_COMPRESS \
            -e CCACHE_COMPRESSLEVEL \
            -e HOME=/tmp \
            "$IMAGE" ccache -s || true

  build-i386:
    strategy:
      fail-fast: true
      matrix:
        include:
          - ver: v3
            flags: -march=i686 -mtune=znver3 -mavx2 -mfma -mbmi -mbmi2 -mf16c -mmovbe ${{ vars.FLAGS }}
            isa: avx2
          - ver: v4
            flags: -march=i686 -mtune=znver4 -mavx2 -mfma -mbmi -mbmi2 -mf16c -mmovbe -mavx512f -mavx512bw -mavx512cd -mavx512dq -mavx512vl ${{ vars.FLAGS }}
            isa: avx512
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      IMAGE: nafigat0r/devuan:6-dev-i386
      WORKDIR: /work
      HOST_CCACHE_DIR: "${{ github.workspace }}/.ccache-gamescope-i386-${{ matrix.ver }}"
      CCACHE_DIR: "/work/.ccache-gamescope-i386-${{ matrix.ver }}"
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: '6'
    steps:
      - name: Compute version variables
        run: |
          GAMESCOPE_TAG="${TAG#v}"
          echo "GAMESCOPE_TAG=$GAMESCOPE_TAG" >> $GITHUB_ENV
          echo "Using GAMESCOPE_TAG=$GAMESCOPE_TAG"

      - name: Fix workspace ownership
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            --user 0:0 \
            "$IMAGE" chown -R $(id -u):$(id -g) "${{ env.WORKDIR }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          set-safe-directory: false

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.HOST_CCACHE_DIR }}
          key: ccache-gamescope-i386-${{ matrix.ver }}-${{ github.sha }}
          restore-keys: |
            ccache-gamescope-i386-${{ matrix.ver }}-

      - name: Download Debian packaging and clone source
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e HOME=/tmp \
            -e GAMESCOPE_TAG="${{ env.GAMESCOPE_TAG }}" \
            -w "${{ env.WORKDIR }}" \
            "$IMAGE" bash -c '
              set -e

              mkdir -p /tmp/gamescope-debian
              cd /tmp/gamescope-debian

              wget -q --show-progress \
                "http://ftp.debian.org/debian/pool/contrib/g/gamescope/gamescope_${GAMESCOPE_TAG}+ds-1~bpo13+1.debian.tar.xz" \
                -O gamescope-debian.tar.xz || { \
