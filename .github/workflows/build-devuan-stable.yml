        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:${{ env.WORKDIR }}" \
            -e CCACHE_DIR="${{ env.CCACHE_DIR }}" \
            -e CCACHE_MAXSIZE \
            -e CCACHE_COMPRESS \
            -e CCACHE_COMPRESSLEVEL \
            -e HOME=/tmp \
            "$IMAGE" ccache -s || true

  publish:
    needs: [build, build-i386]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reprepro and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro gnupg

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Unpack deb files
        run: |
          mkdir -p build
          for f in artifacts/*.tar.zst; do
            echo "Extracting $f"
            tar --zstd -xf "$f" -C build --strip-components=1
          done
          ls -lh build/

      - name: Import GPG key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --no-tty --import
          echo "--- Imported secret keys ---"
          gpg --list-secret-keys
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Create APT repository
        run: |
          mkdir -p apt-repo/conf
          cp .github/helpers/distributions apt-repo/conf/distributions

          for arch in amd64 i386; do
            for codename in stable-avx2 stable-avx512; do
              for deb in build/*+${codename#stable-}_${arch}.deb; do
                [ -f "$deb" ] || continue
                reprepro -Vb apt-repo -C main -A ${arch} includedeb ${codename} "$deb"
              done
            done
          done

          echo "--- Repository structure ---"
          find apt-repo -type f | sort

          echo "--- Export public key ---"
          gpg --armor --export > apt-repo/public.asc
          ls -lh apt-repo/public.asc

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apt-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: [build, build-i386]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GAMESCOPE_TAG="${TAG#v}"
          FLAGS=(--latest)
          [[ $DRAFT = true ]] && FLAGS=(--draft)

          TITLE="${GAMESCOPE_TAG} (Clang)"
          [[ $DRAFT = true ]] && TITLE="[DRAFT] $TITLE"

          ls -lh artifacts/

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ $DRAFT = true ]] && exit 0

            echo "Release $TAG already exists - uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              artifacts/*.zst
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target ${{ github.sha }} \
              --title "$TITLE" \
              --notes-file .github/release-notes.md \
              "${FLAGS[@]}" \
              artifacts/*.zst
          fi