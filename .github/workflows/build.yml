name: Build Gamescope with Clang (x86-64-v4)

on:
  workflow_dispatch:
    inputs:
      gamescope_tag:
        description: 'Gamescope release tag (e.g. 3.16.22)'
        required: true
        default: '3.16.22'
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GAMESCOPE_TAG: ${{ inputs.gamescope_tag || '3.16.22' }}
  DEB_SOURCE_TAG: '3.16.22'
  OPT_FLAGS: '-march=x86-64-v4 -mtune=znver4 -O3 -fno-plt -fomit-frame-pointer -falign-functions=32 -falign-loops=32'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'

jobs:
  build-deb:
    runs-on: self-hosted
    container:
      image: devuan/devuan:excalibur
      options: --user root
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${GAMESCOPE_TAG}-clang-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: $TAG"

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://mirror.yandex.ru/mirrors/devuan/merged excalibur main contrib" > /etc/apt/sources.list
          echo "deb http://mirror.yandex.ru/mirrors/devuan/merged excalibur-updates main contrib" >> /etc/apt/sources.list
          echo "deb http://mirror.yandex.ru/mirrors/devuan/merged excalibur-security main contrib" >> /etc/apt/sources.list
          apt update

          apt install -y --no-install-recommends \
            build-essential cmake meson ninja-build pkg-config \
            clang lld llvm \
            ccache \
            dpkg-dev debhelper devscripts equivs fakeroot quilt \
            ca-certificates wget xz-utils git \
            glslang-tools hwdata \
            catch2 \
            libpipewire-0.3-dev libx11-dev libwayland-dev libvulkan-dev \
            wayland-protocols libx11-xcb-dev libxdamage-dev libxcomposite-dev \
            libxcursor-dev libxxf86vm-dev libxtst-dev libxres-dev libxmu-dev \
            libxkbcommon-dev libcap-dev libsdl2-dev libavif-dev libpixman-1-dev \
            liblcms2-dev libseat-dev libinput-dev xwayland \
            libxcb-composite0-dev libxcb-ewmh-dev libxcb-icccm4-dev libxcb-res0-dev \
            libdrm-dev libdisplay-info-dev libliftoff-dev libluajit-5.1-dev \
            libbenchmark-dev libglm-dev libstb-dev libudev-dev \
            libwlroots-0.18-dev spirv-headers vkroots-headers \
            libxcb-dri3-dev libxcb-errors-dev libxcb-image0-dev libxcb-present-dev \
            libxcb-render-util0-dev libxcb-render0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb1-dev \
            libxext-dev libxfixes-dev libxrender-dev libeis-dev

      - name: Download Debian packaging
        run: |
          mkdir -p /tmp/gamescope-debian
          cd /tmp/gamescope-debian
          # Download the .debian.tar.xz from Debian pool (matching major version)
          # This provides debian/control, debian/rules, etc.
          wget -q --show-progress \
            "http://ftp.debian.org/debian/pool/contrib/g/gamescope/gamescope_${DEB_SOURCE_TAG}+ds-1~bpo13+1.debian.tar.xz" \
            -O gamescope-debian.tar.xz || \
          { echo "Could not download Debian packaging for ${DEB_SOURCE_TAG}"; exit 1; }
          tar xf gamescope-debian.tar.xz
          echo "Debian packaging extracted:"
          ls -la debian/

      - name: Clone Gamescope source
        run: |
          rm -rf gamescope
          git clone --depth 1 --branch "${GAMESCOPE_TAG}" \
            https://github.com/ValveSoftware/gamescope.git gamescope
          cd gamescope
          git submodule update --init --recursive
          echo "Gamescope source at tag: ${GAMESCOPE_TAG}"

      - name: Copy Debian packaging
        run: |
          cp -r /tmp/gamescope-debian/debian gamescope/
          ls -la gamescope/debian/

      - name: Apply Debian patches
        working-directory: gamescope
        run: |
          if [ ! -d debian/patches ]; then
            echo "ERROR: debian/patches not found — cannot proceed"
            exit 1
          fi

          export QUILT_PATCHES=debian/patches
          quilt push -a

          echo "--- Applied patches ---"
          quilt applied

          # Verify that the glm/stb patch was applied
          if grep -q "subproject('glm')" meson.build; then
            echo "WARNING: glm is still a subproject — patch may not have applied"
          else
            echo "OK: glm converted to dependency"
          fi

      - name: Patch debian/rules
        working-directory: gamescope
        run: |
          # Replace GCC-specific configuration with Clang + optimization flags
          # The original rules use dh_auto_configure with -Dpipewire=enabled etc.
          # We add CFLAGS/CXXFLAGS via environment and override the configure step.

          cp ../.github/helpers/rules debian/

          chmod +x debian/rules

          echo "--- Patched debian/rules ---"
          cat debian/rules

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gamescope-${{ env.GAMESCOPE_TAG }}-${{ github.sha }}
          restore-keys: |
            ccache-gamescope-${{ env.GAMESCOPE_TAG }}-
            ccache-gamescope-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -s

      - name: Build .deb package
        working-directory: gamescope
        env:
          CC: ccache clang
          CXX: ccache clang++
          CCACHE_DIR: ${{ env.CCACHE_DIR }}
          CCACHE_MAXSIZE: ${{ env.CCACHE_MAXSIZE }}
          # Ensure Clang is used by dh_auto_configure
          DEB_CFLAGS_MAINT_APPEND: ${{ env.OPT_FLAGS }}
          DEB_CXXFLAGS_MAINT_APPEND: ${{ env.OPT_FLAGS }}
        run: |
          # Clean any previous build
          dh_clean || true
          rm -rf obj-* || true

          # Verify ccache sees the compilers
          ccache --version | head -1
          ccache -s

          # Build only binary package, no source, no signing
          export DEB_BUILD_OPTIONS="noautodbgsym noddebs parallel=$(nproc)"
          dpkg-buildpackage -b -us -uc

          echo "--- .deb files in parent directory ---"
          ls -lh ../*.deb || echo "No .deb files found"

      - name: Collect packages
        run: |
          mkdir -p packages
          find . -maxdepth 1 -name '*.deb' ! -name '*dbgsym*' ! -name '*ddeb*' -exec mv {} packages/ \;
          echo "--- packages/ contents ---"
          ls -lh packages/
          if [ -z "$(ls -A packages/)" ]; then
            echo "ERROR: packages/ is empty — dpkg-buildpackage produced no .deb"
            exit 1
          fi

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload .deb packages as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamescope-deb-packages
          path: packages/*.deb
          retention-days: 5

  release:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamescope-deb-packages
          path: .

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-deb.outputs.tag }}
          GAMESCOPE_TAG: ${{ env.GAMESCOPE_TAG }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading files"
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              ./*.deb
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Gamescope ${GAMESCOPE_TAG} (Clang x86-64-v4)" \
              --latest \
              ./*.deb
          fi